# Lint, secret and test hooks block the commit; the CLAUDE.md hook is a reminder only.
# See CONTRIBUTING.md.
exclude: ^run-engine/ui_dist/
default_install_hook_types: [pre-commit, pre-push]  # `pre-commit install` sets up both
default_stages: [pre-commit]  # only all-tests runs on push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^site/public/media/ # the showcase's compressed clips (each under 2 MB) are committed on purpose
      - id: check-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]  # not Markdown: docs keep their code samples as written
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # imported dev-workflow scripts stay byte-identical to the source; SC2016 flags GraphQL $vars
        args: [--exclude=SC2016]
  - repo: local
    hooks:
      - id: engine-tests
        name: run-engine/run_tests.sh
        language: system
        # `git commit -a` hands hooks a temp GIT_INDEX_FILE; the tests' own temp repos must not write into it
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE bash run-engine/run_tests.sh
        files: ^run-engine/.*\.py$
        pass_filenames: false
      - id: all-tests
        name: run-engine/test_*.py (all, ~2 min)
        language: system
        entry: bash run-engine/run_tests.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: claude-md-reminder
        name: CLAUDE.md is a stable baseline
        language: system
        entry: echo "WARNING - CLAUDE.md changed. It should change only when the user explicitly asked for it."
        files: ^CLAUDE\.md$
        pass_filenames: false
        verbose: true
