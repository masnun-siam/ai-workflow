# Format, vet, secret and test hooks block the commit; the CLAUDE.md hook is a reminder only.
# See CONTRIBUTING.md.
default_install_hook_types: [pre-commit, pre-push]  # `pre-commit install` sets up both
default_stages: [pre-commit]  # only all-tests runs on push
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^internal/web/dist/ # the committed UI build
      - id: check-symlinks
      - id: trailing-whitespace
        exclude: ^internal/web/dist/
      - id: end-of-file-fixer
        exclude: ^internal/web/dist/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: bash -c 'out=$(gofmt -l "$@"); [ -z "$out" ] || { echo "gofmt needed:"; echo "$out"; exit 1; }' --
        types: [go]
      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        types: [go]
        pass_filenames: false
      - id: all-tests
        name: make test
        language: system
        # git exports GIT_DIR/GIT_INDEX_FILE to hooks (in a worktree too); tests that run git must not inherit them
        entry: env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX make test
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: claude-md-reminder
        name: CLAUDE.md is a stable baseline
        language: system
        entry: echo "WARNING - CLAUDE.md changed. It should change only when the user explicitly asked for it."
        files: ^CLAUDE\.md$
        pass_filenames: false
        verbose: true
