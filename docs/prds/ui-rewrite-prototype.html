<meta charset="utf-8">
<title>aiw prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail (repo + nav + away/usage) | work area | optional right detail panel. The pipeline track is the one bold element. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#E9EBEF; --line:#DCE0E6; --line-strong:#C6CBD3;
  --ink:#151820; --muted:#5B6370; --faint:#8A919D;
  --accent:#3247D1; --accent-ink:#FFFFFF; --accent-soft:#E5E8FB;
  --plan:#7550CF; --plan-soft:#EEE8FA;
  --build:#1C74CF; --build-soft:#E2EEFA;
  --review:#A86C0E; --review-soft:#FAF0DC;
  --ship:#17865A; --ship-soft:#DFF2E8;
  --you:#CF4511; --you-soft:#FCE9DF;
  --bad:#C22B2B; --bad-soft:#FADFDF;
  --away:#2E6B66; --away-soft:#DDEFEC;
  --shadow:0 12px 32px rgba(20,24,32,.14), 0 2px 6px rgba(20,24,32,.06);
  --font:'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#161A20; --sunk:#1B2027; --line:#29303A; --line-strong:#3A4250;
  --ink:#E6E9EE; --muted:#9AA3B0; --faint:#6D7582;
  --accent:#8B98FF; --accent-ink:#0F1216; --accent-soft:#232A4D;
  --plan:#AE93F2; --plan-soft:#2A2342; --build:#62AEF2; --build-soft:#162B40;
  --review:#E4AC50; --review-soft:#3A2D16; --ship:#56C894; --ship-soft:#14301F;
  --you:#FF8C55; --you-soft:#3E2216; --bad:#FF7070; --bad-soft:#3E1B1B;
  --away:#6CC7BD; --away-soft:#163331;
  --shadow:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#161A20; --sunk:#1B2027; --line:#29303A; --line-strong:#3A4250;
  --ink:#E6E9EE; --muted:#9AA3B0; --faint:#6D7582;
  --accent:#8B98FF; --accent-ink:#0F1216; --accent-soft:#232A4D;
  --plan:#AE93F2; --plan-soft:#2A2342; --build:#62AEF2; --build-soft:#162B40;
  --review:#E4AC50; --review-soft:#3A2D16; --ship:#56C894; --ship-soft:#14301F;
  --you:#FF8C55; --you-soft:#3E2216; --bad:#FF7070; --bad-soft:#3E1B1B;
  --away:#6CC7BD; --away-soft:#163331;
  --shadow:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:-.015em}
h2{font-size:15px;font-weight:700}
h3{font-size:14px;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* tones */
.t-plan{--c:var(--plan);--cs:var(--plan-soft)} .t-build{--c:var(--build);--cs:var(--build-soft)}
.t-review{--c:var(--review);--cs:var(--review-soft)} .t-ship{--c:var(--ship);--cs:var(--ship-soft)}
.t-you{--c:var(--you);--cs:var(--you-soft)} .t-bad{--c:var(--bad);--cs:var(--bad-soft)}
.t-muted{--c:var(--muted);--cs:var(--sunk)} .t-away{--c:var(--away);--cs:var(--away-soft)}
.t-accent{--c:var(--accent);--cs:var(--accent-soft)}

/* app frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.app.has-panel{grid-template-columns:240px minmax(0,1fr) min(480px,40vw)}
.rail{background:var(--sunk);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:12px 10px;min-height:0;overflow:auto}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);min-height:56px}
.content{flex:1;min-height:0;overflow:auto;padding-block:24px 96px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.content-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border-left:1px solid var(--line);min-height:0;display:flex;flex-direction:column}

/* rail */
.repo-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;text-align:left}
.repo-btn:hover{background:var(--surface);border-color:var(--line)}
.repo-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav-a:hover{background:var(--surface);color:var(--ink)}
.nav-a.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav-a .count{margin-left:auto;font-size:12px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--you);color:#fff}
.nav-a .count.quiet{background:var(--line);color:var(--muted)}
.rail-sep{height:1px;background:var(--line);margin:8px 4px}
.rail-label{font-size:12px;color:var(--faint);padding:4px 10px 2px;font-weight:600}
.live-mini{display:flex;flex-direction:column;gap:2px}
.live-mini button{display:flex;gap:8px;align-items:center;padding:5px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left;font-size:13px;color:var(--muted);width:100%}
.live-mini button:hover{background:var(--surface);color:var(--ink)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.you{background:var(--you);color:#fff;border-color:var(--you)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 45%, var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:26px}
.split{display:inline-flex}
.split .btn:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.split .btn:last-child{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:color-mix(in srgb, var(--accent-ink) 30%, var(--accent));padding:0 6px}
.split .btn:not(.primary):last-child{border-left-color:var(--line-strong)}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:34px}
textarea.f{resize:vertical;line-height:1.5}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
label.lbl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
label.lbl .hint{font-weight:400;color:var(--muted)}
.switch{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--ship)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--bg)}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--cs,var(--sunk));color:var(--c,var(--muted));white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.live .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.ref{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--cs);color:var(--ink);border:1px solid color-mix(in srgb, var(--c) 30%, transparent)}
.banner > svg{color:var(--c);flex:none;margin-top:2px}
.banner .grow p+p{margin-top:2px}
.top-banner{border-radius:0;border-width:0 0 1px 0;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px))}

/* page head */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted)}
.crumbs button:hover{color:var(--ink);text-decoration:underline}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list > *+*{border-top:1px solid var(--line)}
.group-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.group-h .n{color:var(--faint);font-weight:600}

/* inbox item */
.item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:start}
.item-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.item-title{font-weight:600}
.item-meta{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item-meta .sep{color:var(--faint)}
.item-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.item-body{grid-column:2 / -1;margin-top:4px}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left;font:inherit}
.linkish:hover{text-decoration:underline}

/* question */
.qform{display:flex;flex-direction:column;gap:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.q-h{font-size:12px;font-weight:700;color:var(--you)}
.q-text{font-weight:600;margin:2px 0 8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;align-items:start}
.opt:hover{border-color:var(--line-strong)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt input{margin:3px 0 0;accent-color:var(--accent)}
.opt .d{color:var(--muted);font-size:13px}
.rec{font-size:11.5px;font-weight:700;color:var(--ship);margin-left:6px}

/* features */
.frow{display:grid;grid-template-columns:minmax(0,1.6fr) 150px minmax(160px,1.2fr) auto;gap:18px;align-items:center;padding:14px 16px;cursor:pointer}
.frow:hover{background:color-mix(in srgb, var(--sunk) 55%, transparent)}
.ftitle{font-weight:650;font-size:15px}
.fmeta{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}

/* track: the signature element */
.track{display:flex;flex-direction:column;gap:6px;min-width:0}
.track-bar{display:flex;gap:3px;height:8px}
.track-bar > i{flex:1;border-radius:2px;background:var(--line)}
.track-bar > i.done{background:var(--c)}
.track-bar > i.now{background:repeating-linear-gradient(-45deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 45%,transparent) 3px 6px)}
.track-bar > .work{flex:3;display:flex;border-radius:2px;overflow:hidden;background:var(--line)}
.track-bar > .work > span{height:100%}
.track-cap{font-size:12px;color:var(--muted)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr) 3fr 1fr;gap:4px}
.step{display:flex;flex-direction:column;gap:8px}
.step .bar{height:10px;border-radius:3px;background:var(--line)}
.step.done .bar{background:var(--c)}
.step.now .bar{background:repeating-linear-gradient(-45deg,var(--c) 0 4px,color-mix(in srgb,var(--c) 40%,transparent) 4px 8px)}
.step .lab{font-size:12.5px;color:var(--faint);font-weight:600}
.step.done .lab{color:var(--muted)} .step.now .lab{color:var(--ink)}
.step .work{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.next .k{font-size:12.5px;font-weight:700;color:var(--muted)}
.next .t{font-size:17px;font-weight:700;margin-top:2px}
.next .h{color:var(--muted);margin-top:3px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{color:var(--faint);margin-left:4px;font-weight:500}

/* tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:color-mix(in srgb, var(--sunk) 55%, transparent)}
.tbl tr.sub td{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--muted);padding:6px 12px}
.tbl td.num{text-align:right}

/* board */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(5, minmax(210px,1fr));gap:10px;min-width:1090px}
.bcol-h{display:flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;color:var(--muted);padding:0 4px 6px}
.bcol-h i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.bcol{display:flex;flex-direction:column;gap:8px;min-height:40px;padding:6px;border-radius:10px;background:var(--sunk)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.card:hover{border-color:var(--line-strong)}
.card.you{border-color:var(--you);box-shadow:0 0 0 1px var(--you)}
.card .t{font-weight:600;font-size:13px;line-height:1.35}
.lane{display:flex;flex-direction:column;gap:10px}
.lane-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lane-h .name{font-weight:700;font-size:15px;border:0;background:none;padding:0;cursor:pointer}
.lane-h .name:hover{text-decoration:underline}

/* activity */
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.live-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.live-card:hover{border-color:var(--line-strong)}
.live-card.you{border-color:var(--you)}
.live-card .cmd{font-family:var(--mono);font-size:13px;font-weight:500}

/* session */
.sess-grid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0}
.events{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.ev{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 8px;border-radius:8px}
.ev.tool{cursor:pointer}
.ev.tool:hover{background:var(--bg)}
.ev .ic{color:var(--faint);margin-top:2px}
.ev.text .body{white-space:pre-wrap}
.ev.tool .body{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.ev.tool .body b{color:var(--ink);font-weight:500}
.ev pre{margin:6px 0 0;padding:10px;background:var(--bg);border-radius:6px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--ink);max-height:240px;overflow:auto}
.ev.result{background:var(--cs);color:var(--ink)}
.composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.composer textarea{border:0;background:none;resize:none;flex:1;min-height:36px;max-height:160px;padding:8px}
.composer textarea:focus{outline:none}

/* panel */
.p-head{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.p-body{flex:1;overflow:auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:18px}
.p-foot{border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.prose{line-height:1.6;max-width:72ch}
.prose h2{font-size:16px;margin:18px 0 6px}
.prose h3{margin:14px 0 4px}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.checks{display:flex;flex-direction:column;gap:4px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff div{padding:1px 10px;white-space:pre}
.diff .a{background:var(--ship-soft)} .diff .r{background:var(--bad-soft)} .diff .h{background:var(--sunk);color:var(--muted)}
.comment{display:grid;grid-template-columns:28px 1fr;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}

.palette input{border:0;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px 18px;font-size:16px;background:none;width:100%}
.palette input:focus{outline:none}
.pal-list{overflow:auto;padding:6px}
.pal-g{font-size:12px;font-weight:700;color:var(--faint);padding:8px 10px 4px}
.pal-i{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.pal-i.on{background:var(--accent-soft)}
.pal-i .r{margin-left:auto;color:var(--faint);font-size:12px}
.menu{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:220px}
.menu button{display:flex;gap:8px;align-items:center;width:100%;padding:7px 10px;border:0;background:none;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--sunk)}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}

/* start dialog */
.start{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:440px;max-height:78vh}
.start-list{border-right:1px solid var(--line);overflow:auto;padding:8px}
.start-list .g{font-size:12px;font-weight:700;color:var(--faint);padding:10px 10px 4px}
.start-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;cursor:pointer}
.start-list button:hover{background:var(--sunk)}
.start-list button.on{background:var(--accent-soft)}
.start-list .s{font-size:12px;color:var(--muted);font-family:var(--mono)}

.lens.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:28px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px}

.demo .menu{bottom:44px;right:0;width:280px}

   title:s.question.items.length>1?`${s.question.items.length} questions from ${s.cmd} ${s.arg}`:s.question.items[0].q,
   meta:[repoBy(db,s.repo)?.name,s.feature&&featureById(db,s.feature)?.title,`asked ${s.id==='s2'?'2':'5'} min ago`]}));
 db.features.forEach(f=>{

   acts:[{l:'Approve PRD anyway',a:'approve',p:f.id},{l:'Run 2 more rounds',a:'moreRounds',p:f.id},{l:'Open review',a:'openFeature',p:[f.id,'review'],primary:1}]});
  if(f.stage==='review'&&f.review?.state==='approved') out.push({key:'appr'+f.id,kind:'decide',icon:'check',tone:'plan',title:`Every lens approves “${f.title}”`,meta:[repoBy(db,f.repo).name],detail:'Approving sets the PRD to Approved and files its epic on GitHub.',acts:[{l:'Approve PRD',a:'approve',p:f.id,primary:1},{l:'Read PRD',a:'openFeature',p:[f.id,'prd']}]});
 });
 Object.values(db.prs).filter(mergeable).forEach(pr=>{const i=db.issues[pr.issue];out.push({key:'m'+pr.n,kind:'decide',icon:'merge',tone:'ship',title:`PR #${pr.n} is ready to merge`,meta:[repoBy(db,i.repo).name,`#${i.n} ${i.title}`],detail:`Approved by ${pr.reviewer}. All ${pr.checks.length} checks pass.`,acts:[{l:'Review and merge',a:'pr',p:pr.n,primary:1}]})});
 Object.values(db.issues).filter(i=>i.status==='grinding'&&i.grind?.paused).forEach(i=>out.push({key:'g'+i.n,kind:'fix',icon:'pause',tone:'review',title:`Grind paused on PR #${i.pr}`,meta:[repoBy(db,i.repo).name,`#${i.n} ${i.title}`,`round ${i.grind.round}`],detail:i.grind.paused+'.',
   acts:[{l:'Skip CI and continue',a:'skipCi',p:i.n},{l:'Stop grind',a:'stopGrind',p:i.n},{l:'Open PR',a:'pr',p:i.pr,primary:1}]}));
 db.sessions.filter(s=>s.status==='failed').forEach(s=>out.push({key:s.id,kind:'fix',icon:'alert',tone:'bad',title:`${s.cmd} ${s.arg} failed`,meta:[repoBy(db,s.repo)?.name,s.issue&&db.issues[s.issue].title,s.started],detail:s.error,
   acts:[{l:'Continue in terminal',a:'terminal',p:s.id},{l:'Open session',a:'session',p:s.id},{l:'Retry',a:'retry',p:s.id,primary:1}]}));
 Object.values(db.issues).filter(i=>i.cleanup).forEach(i=>out.push({key:'c'+i.n,kind:'fix',icon:'trash',tone:'muted',title:`Worktree for #${i.n} has unsaved work`,meta:[repoBy(db,i.repo).name,`merged ${i.title}`],detail:`${i.cleanup.uncommitted.length} uncommitted file, ${i.cleanup.unpushed.length} unpushed commit. Merged worktrees are removed automatically only when clean.`,
   acts:[{l:'Review and clean up',a:'cleanup',p:i.n,primary:1}]}));
 db.repos.filter(r=>r.remote==='none').forEach(r=>out.push({key:'pub'+r.slug,kind:'setup',icon:'github',tone:'muted',title:`${r.name} has no GitHub remote`,meta:[r.path],detail:'Planning, issues and PRs need a GitHub repo. Publishing creates a private repo and pushes main.',acts:[{l:'Publish to GitHub',a:'publish',p:r.slug,primary:1}]}));

  case 'review':
   if(f.review.state==='cap')return {t:'Review stopped at the round limit',h:f.review.note,btn:'Decide',a:'tab:review',alt:{l:'Approve anyway',a:'approve'}};
   if(f.review.state==='approved')return {t:'Every lens approves',h:'Approving files the epic and unlocks tasks.',btn:'Approve PRD',a:'approve'};
   {const v=Object.values(f.review.lenses);return {t:`Peer review round ${f.review.round} of ${f.review.max} is running`,h:`${v.filter(x=>x==='approve').length} of ${v.length} lenses approve. You hear from it only if it needs you.`,btn:'Watch review',a:'tab:review',quiet:1,alt:{l:'Approve now',a:'approve'}}}
  case 'approved':return {t:'Break it into tasks',h:`Creates small one-PR issues under epic #${f.epic}, with dependencies.`,btn:'Create tasks',a:'createTasks'};
  case 'tasks':return {t:`${c.unrefined||0} issue${c.unrefined===1?'':'s'} need refinement`,h:'Refining writes WHAT, WHY and HOW so each issue can be built without guessing.',btn:`Refine ${c.unrefined||0}`,a:'refineAll',alt:c.ready?{l:`Start ${c.ready} ready`,a:'startReady'}:null};
  case 'building':{
   const m=iss.filter(i=>mergeable(db.prs[i.pr]));
   if(m.length)return {t:`${m.length} PR ready to merge`,h:`#${m[0].n} ${m[0].title}: approved, checks green.`,btn:'Review and merge',a:'pr:'+m[0].pr,alt:f.autobuild?null:{l:'Turn on auto-build',a:'toggleAuto'}};
   if(!f.autobuild&&c.ready)return {t:`${c.ready} issues ready to build`,h:'Start them yourself, or turn on auto-build to start them as slots free up.',btn:'Turn on auto-build',a:'toggleAuto',alt:{l:`Start ${c.ready} now`,a:'startReady'}};
   return {t:'Building',h:`${c.merged||0} of ${iss.length} merged. Auto-build is ${f.autobuild?'on':'off'}.`,btn:'Open board',a:'board',quiet:1};}
  case 'shipped':return {t:'Everything merged',h:'Close the epic to tidy GitHub. Its issues are already closed.',btn:'Close epic',a:'closeEpic'};
 }
}

    ${q.free&&html`<label className=${`opt ${ans[k].useOther?'on':''}`}><input type="radio" name=${s.id+'q'+k} checked=${ans[k].useOther} onChange=${()=>set(k,{useOther:true})}/>
     <span className="stack" style=${{gap:6}}><span style=${{fontWeight:600}}>Something else</span>${ans[k].useOther&&html`<textarea className="f" rows="2" maxLength="4000" autoFocus placeholder="Write your own answer" value=${ans[k].other} onInput=${e=>set(k,{other:e.target.value})}></textarea>`}</span></label>`}

  <div className="row wrap">

 </form>`;

function IssueAction({i}){
 const {db,act}=useApp();
 const s=i.session&&sessById(db,i.session), pr=i.pr&&db.prs[i.pr], repo=repoBy(db,i.repo);
 const stop=e=>e.stopPropagation();
 let el=null;
 if(i.status==='unrefined')el=html`<button className="btn sm" onClick=${()=>act('refine',[i.n])}>Refine</button>`;
 else if(i.status==='blocked')el=html`<span className="muted" style=${{fontSize:13}}><${Icon} n="lock" s=${13}/> after ${i.blockedBy.map(b=>'#'+b).join(', ')}</span>`;
 else if(i.status==='ready'&&i.queued)el=html`<${Chip}>Queued<//>`;
 else if(i.status==='ready')el=html`<span className="split"><button className="btn sm primary" onClick=${()=>act('startIssue',{n:i.n})}>${i.lastFailed?'Retry':'Start'}</button><${StartMenu} n=${i.n}/></span>`;
 else if(i.status==='in_progress'&&s?.status==='waiting')el=html`<button className="btn sm you" onClick=${()=>act('session',s.id)}>Answer</button>`;
 else if(i.status==='in_progress')el=html`<button className="btn sm" onClick=${()=>act('session',i.session)}>Watch</button>`;
 else if(i.status==='in_review'&&mergeable(pr))el=html`<button className="btn sm primary" onClick=${()=>act('pr',i.pr)}>Merge</button>`;
 else if(i.status==='in_review'&&!repo.autoGrind)el=html`<button className="btn sm" onClick=${()=>act('grind',i.n)}>Grind</button>`;
 else if(i.status==='in_review')el=html`<button className="btn sm" onClick=${()=>act('pr',i.pr)}>Open PR</button>`;
 else if(i.status==='grinding'&&i.grind?.paused)el=html`<button className="btn sm" onClick=${()=>act('skipCi',i.n)}>Skip CI</button>`;
 else if(i.status==='grinding')el=html`<span className="muted" style=${{fontSize:13}}>round ${i.grind?.round}</span>`;
 else if(i.cleanup)el=html`<button className="btn sm" onClick=${()=>act('cleanup',i.n)}>Clean up</button>`;
 return html`<span onClick=${stop}>${el}</span>`;
}

function SessionActions({s,sm}){
 const {act}=useApp(); const c=`btn ${sm?'sm':''}`;
 const more=[LIVE.includes(s.status)&&{l:'Stop session',icon:'stop',danger:1,on:()=>act('stop',s.id)},
  !LIVE.includes(s.status)&&{l:'Run again with the same input',icon:'refresh',on:()=>act('rerun',s.id)},
  {l:'Copy terminal resume command',icon:'terminal',on:()=>act('terminal',s.id)}];
 let main=null;
 if(s.status==='waiting')main=html`<button className=${c+' you'} onClick=${()=>act('session',s.id)}>Answer</button>`;
 else if(s.status==='failed')main=html`<button className=${c} onClick=${()=>act('retry',s.id)}>Retry</button>`;
 else if(s.status==='stopped')main=html`<button className=${c} onClick=${()=>act('retry',s.id)}>Resume</button>`;
 else if(s.status==='limited')main=html`<button className=${c} onClick=${()=>act('resumeOther',s.id)}>Resume elsewhere</button>`;
 else if(s.status==='queued')main=html`<button className=${c} onClick=${()=>act('startNow',s.id)}>Start now</button>`;
 return html`<span className="row" style=${{justifyContent:'flex-end',gap:4}}>${main}<${MoreBtn} sm=${sm} items=${more}/></span>`;
}

/* ---------- Palette ---------- */
function Palette({onClose}){
 const {db,go,act,repo,setRepo,openPanel}=useApp(); const [q,setQ]=useState(''); const [k,setK]=useState(0);
 const all=useMemo(()=>[
  ...[['inbox','Inbox'],['features','Features'],['board','Board'],['activity','Activity'],['settings','Settings']].map(([v,l])=>({g:'Go to',l,r:'',run:()=>go(v)})),
  ...COMMANDS.flatMap(g=>g.items).map(c=>({g:'Start',l:c.name,r:'/'+c.id,run:()=>act('new',{cmd:c.id})})),
  ...db.features.filter(f=>f.repo===repo).map(f=>({g:'Features',l:f.title,r:STAGES[stageIdx(f.stage)].label,run:()=>go('feature',f.id)})),
  ...Object.values(db.issues).filter(i=>i.repo===repo&&i.status!=='merged').map(i=>({g:'Issues',l:`#${i.n} ${i.title}`,r:ISSUE[i.status].label,run:()=>openPanel({kind:'issue',n:i.n})})),
  ...Object.values(db.prs).map(p=>({g:'Pull requests',l:`#${p.n} ${p.title}`,r:'PR',run:()=>openPanel({kind:'pr',n:p.n})})),
  ...db.sessions.map(s=>({g:'Sessions',l:`${s.cmd} ${s.arg}`,r:SESS[s.status].label,run:()=>act('session',s.id)})),
  ...db.repos.filter(r=>r.slug!==repo).map(r=>({g:'Switch repo',l:r.name,r:r.slug,run:()=>setRepo(r.slug)})),
  {g:'Away',l:db.away?'I am back':'Go away for 2 hours',r:'',run:()=>act(db.away?'awayOff':'awayOn',120)},
 ],[db,repo]);
 const res=all.filter(x=>(x.g+' '+x.l+' '+x.r).toLowerCase().includes(q.toLowerCase())).slice(0,40);
 const groups=[...new Set(res.map(r=>r.g))];
 const run=x=>{onClose();x.run()};
 return html`<div className="scrim" onClick=${onClose}><div className="dialog palette" style=${{width:'min(620px,100%)'}} role="dialog" aria-label="Search" onClick=${e=>e.stopPropagation()}>
  <input autoFocus placeholder="Search features, issues, sessions, or start something…" value=${q} onInput=${e=>{setQ(e.target.value);setK(0)}}
   onKeyDown=${e=>{if(e.key==='ArrowDown'){e.preventDefault();setK(Math.min(k+1,res.length-1))}if(e.key==='ArrowUp'){e.preventDefault();setK(Math.max(k-1,0))}if(e.key==='Enter'&&res[k])run(res[k])}}/>
  <div className="pal-list">${groups.map(g=>html`<div key=${g}><div className="pal-g">${g}</div>${res.filter(r=>r.g===g).map(x=>{const idx=res.indexOf(x);return html`<button key=${idx} className=${`pal-i ${idx===k?'on':''}`} onMouseEnter=${()=>setK(idx)} onClick=${()=>run(x)}><span className="ellipsis">${x.l}</span><span className="r">${x.r}</span></button>`})}</div>`)}
   ${!res.length&&html`<p className="muted" style=${{padding:14}}>Nothing matches “${q}”.</p>`}</div>
 </div></div>`;
}

/* ---------- App ---------- */
function App(){
 const [db,setDb]=useState(seed);
 const mut=fn=>setDb(d=>{const n=structuredClone(d);fn(n);return n});
 const [route,setRoute]=useState({view:'inbox'});
 const [repo,setRepo]=useState('blubird/wasensi');
 const [panel,setPanel]=useState(null);
 const [scenario,setScenario]=useState('normal');
 const [palette,setPalette]=useState(false), [start,setStart]=useState(null), [confirm,setConfirm]=useState(null), [toasts,setToasts]=useState([]), [keys,setKeys]=useState(false);
 const later=(ms,fn)=>setTimeout(()=>mut(fn),ms);
 const toast=(msg,o={})=>{const id=Math.random();setToasts(t=>[...t,{id,msg,...o}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),o.ms||4200)};
 const go=(view,id,tab)=>{setRoute({view,id,tab});document.querySelector('.content')?.scrollTo(0,0)};
 const ask=c=>setConfirm(c);
 const newSession=(d,x)=>{const id='s'+(++d.seq);d.sessions.unshift({id,status:'running',started:'Today 14:0'+(d.seq%10),dur:'0 min',cost:0,tokens:'0',account:'personal',repo,events:[{k:'text',t:'Starting…'}],...x});return id};

 // s3's claude process exits after a few seconds, unlocking its answer
 useEffect(()=>{const t=setTimeout(()=>mut(d=>{const s=sessById(d,'s3');if(s)s.processAlive=false}),9000);return()=>clearTimeout(t)},[]);
 // live sessions keep producing events
 useEffect(()=>{const lines=[['Bash','npm run lint','✓ 0 problems'],['Edit','web/src/roles/RolePicker.tsx','+38 −4'],['Bash','npm run test -- roles','Tests: 15 passed'],['Read','app/roles/schemas.py','(64 lines)']];let k=0;
  const t=setInterval(()=>mut(d=>{d.sessions.filter(s=>s.status==='running'&&s.events.length<14).forEach(s=>{const l=lines[k++%lines.length];s.events.push({k:'tool',name:l[0],sum:l[1],out:l[2]})})}),6000);return()=>clearInterval(t)},[]);
 useEffect(()=>{if(db.away)document.documentElement.dataset.away='';else delete document.documentElement.dataset.away},[db.away]);
 useEffect(()=>{const n=needsYou(db,scenario);document.title=(n?`(${n}) `:'')+'aiw prototype'},[db,scenario]);
 const gRef=useRef(0);
 useEffect(()=>{const h=e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setPalette(p=>!p);return}
  if(e.key==='Escape'){if(palette)setPalette(false);else if(start)setStart(null);else if(confirm)setConfirm(null);else if(keys)setKeys(false);else setPanel(null);return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(Date.now()-gRef.current<900){const m={i:'inbox',f:'features',b:'board',a:'activity',s:'settings'}[e.key];gRef.current=0;if(m){go(m);return}}
  if(e.key==='g'){gRef.current=Date.now();return}
  if(e.key==='n'){e.preventDefault();setStart({})}
  if(e.key==='?')setKeys(true);
 };window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h)},[palette,start,confirm,keys]);

 const act=(a,p)=>{
  const net=!['session','issue','pr','feature','new','toast','copy','terminal','shortcuts','reset','openFeature'].includes(a.split(':')[0]);
  if(scenario==='offline'&&net){toast('Not sent: the aiw server is unreachable. Try again when it reconnects.',{bad:1});return}
  if(scenario==='gh'&&['merge','refine','startIssue','feature:createTasks','feature:refineAll','skipCi','addTask','publish'].includes(a)){toast('Needs GitHub. Run gh auth login first.',{bad:1});return}
  if(a.startsWith('feature:')){featureAct(a.slice(8),p);return}
  if(a.startsWith('pr:')){setPanel({kind:'pr',n:+a.slice(3)});return}
  switch(a){
   case 'session':setPanel(null);go('session',p);break;
   case 'issue':setPanel({kind:'issue',n:p});break;
   case 'pr':setPanel({kind:'pr',n:p});break;
   case 'feature':setPanel(null);go('feature',p);break;
   case 'openFeature':go('feature',p[0],p[1]);break;
   case 'new':setStart(p||{});break;
   case 'toast':toast(p);break;
   case 'shortcuts':setKeys(true);break;
   case 'reset':setDb(seed());setScenario('normal');go('inbox');toast('Prototype data reset');break;
   case 'copy':navigator.clipboard?.writeText(p).catch(()=>{});toast(`Copied: ${p}`);break;
   case 'recheck':toast('Still signed out. Run gh auth login, then check again.',{bad:1});break;
   case 'terminal':{const s=sessById(db,p);const cmd=`cd ${repoBy(db,s.repo)?.path||'~/Obsidian/Main'} && claude --resume 4f1c…`;navigator.clipboard?.writeText(cmd).catch(()=>{});toast('Copied the resume command. Paste it in a terminal.');break}
   case 'answer':mut(d=>{const s=sessById(d,p.id);s.events.push({k:'text',you:1,t:'You answered: '+p.ans.map(x=>x.useOther?x.other:x.pick.join(', ')).join(' / ')});s.question=null;s.status='running'});toast('Answer sent. The session is running again.',{action:['Watch',()=>go('session',p.id)]});break;
   case 'retry':mut(d=>{const s=sessById(d,p);s.status='running';s.error=null;s.events.push({k:'text',t:'Resumed.'});if(s.issue){d.issues[s.issue].status='in_progress';d.issues[s.issue].lastFailed=false}});toast('Session restarted');break;
   case 'startNow':mut(d=>{const s=sessById(d,p);s.status='running';s.events.push({k:'text',t:'Started ahead of the queue.'});if(s.issue){d.issues[s.issue].status='in_progress';d.issues[s.issue].queued=false}});toast('Started. Auto-build cap ignored for this one.');break;
   case 'stop':{const s=sessById(db,p);ask({title:`Stop ${s.cmd} ${s.arg}?`,body:html`<p>Claude stops after the current step. The worktree and any commits stay; you can resume later.</p>`,okLabel:'Stop session',danger:1,ok:()=>{mut(d=>{sessById(d,p).status='stopped'});toast('Stopped')}});break}
   case 'rerun':{const s=sessById(db,p);const id=(()=>{let nid;mut(d=>{nid=newSession(d,{cmd:s.cmd,arg:s.arg,repo:s.repo,feature:s.feature,issue:s.issue})});return nid})();toast(`Started ${s.cmd} ${s.arg} again`);break}
   case 'resumeOther':mut(d=>{const s=sessById(d,p);s.status='running';s.account='personal';s.events.push({k:'text',t:'Resumed on the personal account.'})});toast('Resumed on the personal account');break;
   case 'cancelAuto':mut(d=>{sessById(d,p).autoResume=false});toast('Auto-resume off. Resume it yourself when ready.');break;
   case 'prompt':mut(d=>{const s=sessById(d,p.id);s.events.push({k:'text',you:1,t:p.t});if(!LIVE.includes(s.status))s.status='running'});toast(LIVE.includes(sessById(db,p.id).status)?'Queued. It goes out when this turn ends.':'Sent');break;
   case 'startIssue':{
    if(p.herdr){mut(d=>{d.issues[p.n].status='in_progress'});toast(`Opened #${p.n} in a herdr tab. herdr tabs are not tracked here.`);break}
    let id;mut(d=>{id=newSession(d,{cmd:'implement-issue',arg:'#'+p.n,issue:p.n,feature:d.issues[p.n].feature,account:p.account||'personal'});Object.assign(d.issues[p.n],{status:'in_progress',session:id,lastFailed:false})});
    setPanel(null);setTimeout(()=>go('session','s'+(db.seq+1)));toast(`Started #${p.n}`);break}
   case 'refine':{mut(d=>{newSession(d,{cmd:'refine-issues',arg:p.map(n=>'#'+n).join(' '),feature:d.issues[p[0]].feature})});toast(`Refining ${p.map(n=>'#'+n).join(', ')}`,{action:['Watch',()=>go('session','s'+(db.seq+1))]});
    later(3500,d=>{p.forEach(n=>{if(d.issues[n].status==='unrefined')d.issues[n].status='ready'});const s=sessById(d,'s'+(db.seq+1));if(s){s.status='done';s.events.push({k:'result',t:'Refined '+p.length})}});break}
   case 'grind':mut(d=>{const i=d.issues[p];i.status='grinding';i.grind={round:1};newSession(d,{cmd:'pr-grind',arg:'PR #'+i.pr,issue:p,feature:i.feature})});toast('Grind started');break;
   case 'skipCi':mut(d=>{const i=d.issues[p];i.grind={round:i.grind.round+1};newSession(d,{cmd:'pr-grind',arg:'PR #'+i.pr+' --skip-ci',issue:p,feature:i.feature})});toast('Grind continues, skipping CI this round');break;
   case 'stopGrind':ask({title:'Stop grinding this PR?',body:html`<p>The PR stays open in review. You can start grind again from the issue.</p>`,okLabel:'Stop grind',danger:1,ok:()=>{mut(d=>{const i=d.issues[p];i.status='in_review';i.grind=null});toast('Grind stopped')}});break;
   case 'merge':mut(d=>{const pr=d.prs[p];pr.state='merged';const i=d.issues[pr.issue];i.status='merged';
     Object.values(d.issues).forEach(x=>{x.blockedBy=x.blockedBy.filter(b=>d.issues[b].status!=='merged');if(x.status==='blocked'&&!x.blockedBy.length)x.status='ready'})});toast(`Merged PR #${p}. Worktree removed.`);break;
   case 'cleanup':{const i=db.issues[p];ask({title:`Remove the worktree for #${p}?`,body:html`<div className="stack" style=${{gap:8}}><p>This work is not on GitHub and will be lost:</p><ul style=${{margin:0,paddingLeft:18}}>${i.cleanup.uncommitted.map(f=>html`<li key=${f}><span className="mono">${f}</span> (uncommitted)</li>`)}${i.cleanup.unpushed.map(f=>html`<li key=${f}><span className="mono">${f}</span> (not pushed)</li>`)}</ul></div>`,okLabel:'Delete worktree and branch',danger:1,ok:()=>{mut(d=>{d.issues[p].cleanup=null});toast('Worktree removed')}});break}
   case 'publish':ask({title:`Publish ${p} to GitHub?`,body:html`<div className="stack"><label className="lbl">Owner<select className="f"><option>masnun-siam</option><option>blubird</option></select></label><label className="row"><input type="checkbox" defaultChecked/>Private repository</label></div>`,okLabel:'Create and push',ok:()=>{mut(d=>{const r=repoBy(d,p);r.remote='ok';r.slug='masnun-siam/recipe-box'});toast('Published recipe-box to GitHub')}});break;
   case 'removeRepo':ask({title:'Stop tracking this repo?',body:html`<p>Nothing on disk or GitHub changes. Its sessions stay in Activity.</p>`,okLabel:'Remove',danger:1,ok:()=>toast('Removed')});break;
   case 'addTask':mut(d=>{newSession(d,{cmd:'create-tasks',arg:'finding: '+p.t.slice(0,30),feature:p.f})});toast('Filing the task. It appears under the epic in a moment.');
    later(3000,d=>{const n=Math.max(...Object.keys(d.issues).map(Number))+1;d.issues[n]=I(n,p.t,'unrefined',{feature:p.f,repo});});break;
   case 'cleanSessions':ask({title:'Remove 7 finished sessions?',body:html`<p>Removes the transcripts of done, failed and stopped sessions older than 7 days. Nothing on GitHub changes.</p>`,okLabel:'Remove 7 sessions',danger:1,ok:()=>toast('Removed 7 sessions')});break;
   case 'startCmd':{let id;mut(d=>{id=newSession(d,{cmd:p.cmd,arg:p.arg?(p.arg.length>40?p.arg.slice(0,40)+'…':p.arg):'',repo:p.repo==='vault'?null:(p.repo||repo),feature:p.feature,account:p.account||'personal',status:scenario==='limited'?'queued':'running',queueReason:'Account limited until 16:40. Starts at reset.'})});
    setTimeout(()=>go('session','s'+(db.seq+1)));toast(scenario==='limited'?'Queued until the limit resets':`Started ${p.cmd}`);break}
   case 'awayOn':mut(d=>{d.away={until:p>=120?'16:30':'15:00',held:2};d.awaySummary=null});toast('Away mode on. Your inbox collects what still needs you.');break;
   case 'awayExtend':mut(d=>{d.away.until='17:00'});toast('Away until 17:00');break;
   case 'awayOff':mut(d=>{d.away=null;d.awaySummary={span:'14:30 to 16:30',held:2,log:[{at:'14:41',t:'Answered “Extend can()” for implement-issue #806 (recommended option).'},{at:'15:05',t:'Retried implement-issue #803 after a failure. It passed.'},{at:'15:40',t:'Skipped CI once for the grind on PR #1290.'}]}});go('inbox');break;
   case 'moreRounds':break;
   default:toast(a);
  }
 };
 const featureAct=(a,id)=>{
  const fid=typeof id==='object'?id.id:id; const f=featureById(db,fid);
  switch(a){
   case 'approve':ask({title:`Approve “${f.title}”?`,body:html`<p>Sets the PRD to Approved and files its epic on GitHub. You can still change the PRD later with an update.</p>`,okLabel:'Approve PRD',ok:()=>{mut(d=>{const x=featureById(d,fid);x.stage='approved';x.epic=x.epic||830;x.review=x.review&&{...x.review,state:'approved'}});toast('Approved. Epic filed.')}});break;
   case 'startReview':if(typeof id==='object'){mut(d=>{const x=featureById(d,fid);x.stage='review';x.review={round:1,max:5,state:'running',lenses:Object.fromEntries(id.lenses.map(l=>[l,'waiting']))}});toast('Peer review started')}else go('feature',fid,'review');break;
   case 'moreRounds':mut(d=>{const x=featureById(d,fid);x.review={...x.review,max:x.review.max+2,round:x.review.round+1,state:'running',lenses:{...x.review.lenses,security:'waiting'}}});toast('Running 2 more rounds');break;
   case 'createTasks':mut(d=>{newSession(d,{cmd:'create-tasks',arg:f.prd,feature:fid})});toast('Creating tasks…');
    later(3500,d=>{const x=featureById(d,fid);x.stage='tasks';[['Saved search model','unrefined'],['Save search from the filter bar','unrefined'],['Saved searches sidebar','unrefined']].forEach(([t,s],k)=>{d.issues[821+k]=I(821+k,t,s,{feature:fid,repo:x.repo})})});break;
   case 'refineAll':{const ns=issuesOf(db,fid).filter(i=>i.status==='unrefined').map(i=>i.n);act('refine',ns);later(3600,d=>{featureById(d,fid).stage='building'});break}
   case 'startReady':issuesOf(db,fid).filter(i=>i.status==='ready'&&!i.queued).forEach(i=>mut(d=>{newSession(d,{cmd:'implement-issue',arg:'#'+i.n,issue:i.n,feature:fid});d.issues[i.n].status='in_progress'}));toast('Started every ready issue');break;
   case 'toggleAuto':mut(d=>{const x=featureById(d,fid);x.autobuild=!x.autobuild});toast(f.autobuild?'Auto-build off':'Auto-build on. Ready issues start as slots free up.');break;
   case 'closeEpic':ask({title:`Close epic #${f.epic}?`,body:html`<p>Closes the epic and its ${issuesOf(db,fid).filter(i=>i.status!=='merged').length} open issues as completed.</p>`,okLabel:'Close epic',danger:1,ok:()=>toast(`Closed epic #${f.epic}`)});break;
   case 'board':go('board');break;
   default:if(a.startsWith('pr:'))setPanel({kind:'pr',n:+a.slice(3)});else if(a.startsWith('tab:'))go('feature',fid,a.slice(4));
  }
 };
 const ctx={db,mut,route,go,repo,setRepo:r=>{setRepo(r);if(route.view==='feature')go('features')},openPanel:setPanel,scenario,setScenario,act,toast};
 const nY=needsYou(db,scenario);
 let view;
 if(scenario==='onboarding'&&route.view!=='settings')view=html`<${Onboarding}/>`;
 else switch(route.view){
  case 'features':view=html`<${FeaturesView}/>`;break;
  case 'feature':view=html`<${FeatureView} key=${route.id} id=${route.id} tab=${route.tab}/>`;break;
  case 'board':view=html`<${BoardView}/>`;break;
  case 'activity':view=html`<${ActivityView}/>`;break;
  case 'session':view=html`<${SessionView} key=${route.id} id=${route.id}/>`;break;
  case 'settings':view=html`<${SettingsView}/>`;break;
  default:view=html`<${InboxView}/>`;
 }
 const title={inbox:'Inbox',features:'Features',feature:'Feature',board:'Board',activity:'Activity',session:'Session',settings:'Settings'}[route.view];
 return html`<${Ctx.Provider} value=${ctx}>
  <div className=${`app ${panel?'has-panel':''}`}>
   <${Rail}/>
   <main className="main">
    ${scenario==='offline'&&html`<div className="banner t-bad top-banner"><${Icon} n="wifi"/><div className="grow"><p><b>Can't reach the aiw server at localhost:8420.</b> Retrying every 3 seconds. Actions are paused; what you see may be out of date.</p></div></div>`}
    ${db.away&&html`<div className="banner t-away top-banner"><${Icon} n="moon"/><div className="grow"><p><b>Away until ${db.away.until}.</b> Claude answers questions that have a recommended option and retries failures. The rest waits in your inbox.</p></div><button className="btn sm" onClick=${()=>act('awayOff')}>I'm back</button></div>`}
    <div className="topbar">
     <button className="repo-mark mob-only" style=${{width:26,height:26,fontSize:12,border:0,cursor:'pointer'}} aria-label="Switch repo" onClick=${()=>setPalette(true)}>${repoBy(db,repo)?.name[0]}</button>
     <h2 className="mob-only" style=${{fontSize:16}}>${title}</h2>
     <button className="btn grow" style=${{justifyContent:'flex-start',color:'var(--muted)',fontWeight:500,maxWidth:520}} onClick=${()=>setPalette(true)}><${Icon} n="search"/><span className="grow ellipsis" style=${{textAlign:'left'}}>Search or jump to…</span><span className="kbd hide-sm">⌘K</span></button>
     <span className="grow hide-sm"></span>
     <button className="btn primary" onClick=${()=>setStart({})}><${Icon} n="plus"/><span className="hide-sm">New</span><span className="kbd hide-sm" style=${{background:'transparent',color:'inherit',borderColor:'currentColor',opacity:.6}}>N</span></button>
    </div>
    <div className="content">${view}</div>
   </main>
   ${panel&&html`<aside className="panel" aria-label="Details">${panel.kind==='issue'?html`<${IssuePanel} key=${'i'+panel.n} n=${panel.n}/>`:html`<${PrPanel} key=${'p'+panel.n} n=${panel.n}/>`}</aside>`}
  </div>
  <nav className="mob-nav">${[['inbox','Inbox','inbox',nY],['features','Features','layers'],['board','Board','board'],['activity','Activity','activity'],['settings','More','sliders']].map(([v,l,ic,n])=>html`<button key=${v} className=${route.view===v?'on':''} onClick=${()=>go(v)}><${Icon} n=${ic} s=${20}/>${l}${n?html`<span className="count">${n}</span>`:null}</button>`)}</nav>
  ${palette&&html`<${Palette} onClose=${()=>setPalette(false)}/>`}
  ${start&&html`<${StartDialog} init=${start} onClose=${()=>setStart(null)}/>`}
  ${confirm&&html`<${Confirm} c=${confirm} onClose=${()=>setConfirm(null)}/>`}
  ${keys&&html`<${Confirm} c=${{title:'Keyboard shortcuts',okLabel:'Done',ok:()=>{},body:html`<dl className="facts">${[['⌘K','Search or jump anywhere'],['N','Start something new'],['G then I / F / B / A / S','Inbox, Features, Board, Activity, Settings'],['Esc','Close panel or dialog'],['⌘ Enter','Send a form']].map(([k,v])=>html`<${React.Fragment} key=${k}><dt><span className="kbd">${k}</span></dt><dd>${v}</dd><//>`)}</dl>`}} onClose=${()=>setKeys(false)}/>`}
  <div className="toasts" role="status" aria-live="polite">${toasts.map(t=>html`<div key=${t.id} className=${`toast ${t.bad?'bad':''}`}>${t.msg}${t.action&&html`<button onClick=${t.action[1]}>${t.action[0]}</button>`}</div>`)}</div>
  <${Demo}/>
 <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
